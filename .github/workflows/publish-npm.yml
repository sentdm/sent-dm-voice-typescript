# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/sentdm/sent-dm-voice-typescript/actions/workflows/publish-npm.yml
#
# npm attaches a trusted publisher only to a package that already exists, so a package's
# first version is published with a short-lived NPM_TOKEN repository secret: a granular
# access token for the @sentdm scope with "Bypass 2FA" on, created by an npm org owner
# (the sent_dm account is passkey-only, so a token without the bypass dies here with EOTP).
# Set the secret, dispatch this workflow, then on npmjs.com add a trusted publisher to each
# new package (owner sentdm, repository sent-dm-voice-typescript, workflow publish-npm.yml,
# environment blank, "Allow npm publish" ticked), delete the secret and revoke the token.
# From then on the token is absent and bin/publish-npm authenticates with this job's OIDC
# token. Both paths publish from GitHub Actions with public access and npm provenance.
# A new trusted publisher expires unless a version lands through it within 2 days.
name: Publish NPM
on:
  workflow_dispatch:

  release:
    types: [published]

# The three packages share one version (linked-versions), so release-please publishes three
# GitHub releases at once. bin/publish-npm publishes every package whose version is new, so one
# run is enough: only voice-client's release runs the job, and the other two are skipped. Runs
# still queue, for a manual run that overlaps one.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'voice-client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: |
          pnpm install

      - name: Publish to NPM
        env:
          # Bootstrap fallback for a package's first publish only, see the note at the top.
          # Empty on every other run, so bin/publish-npm takes the OIDC path.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          bash bin/publish-npm
